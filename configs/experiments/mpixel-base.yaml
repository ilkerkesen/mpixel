# lightning.pytorch==2.6.0
seed_everything: 42
trainer:
  accelerator: auto
  strategy: ddp
  devices: '4'
  num_nodes: 8
  precision: bf16-mixed
  logger:
    class_path: lightning.pytorch.loggers.TensorBoardLogger
    init_args:
      save_dir: /path/to/logs
      name: mpixel
      version: v0
      log_graph: false
      default_hp_metric: true
      prefix: ''
      sub_dir: null
      comment: ''
      purge_step: null
      max_queue: 10
      flush_secs: 10
      filename_suffix: ''
  callbacks: null
  fast_dev_run: false
  max_epochs: null
  min_epochs: null
  max_steps: 1000000
  min_steps: null
  max_time: null
  limit_train_batches: null
  limit_val_batches: null
  limit_test_batches: null
  limit_predict_batches: null
  overfit_batches: 0.0
  val_check_interval: 5000
  check_val_every_n_epoch: 1
  num_sanity_val_steps: 0
  log_every_n_steps: 100
  enable_checkpointing: null
  enable_progress_bar: null
  enable_model_summary: null
  accumulate_grad_batches: 1
  gradient_clip_val: 1.0
  gradient_clip_algorithm: null
  deterministic: null
  benchmark: null
  inference_mode: true
  use_distributed_sampler: true
  profiler: null
  detect_anomaly: false
  barebones: false
  plugins: null
  sync_batchnorm: false
  reload_dataloaders_every_n_epochs: 0
  default_root_dir: null
  model_registry: null
model:
  config_path: configs/pixel-base.json
  compile_model: true
  dropout: 0.1
  norm_pix_loss: true
  use_lr_scheduler: true
  learning_rate: 0.0003
  min_lr: 1.0e-05
  adam_epsilon: 1.0e-08
  adam_beta1: 0.9
  adam_beta2: 0.999
  warmup_steps: 50000
  weight_decay: 0.05
  temperature: 1.0
  patch_embedding_init: null
data:
  data_dir: /path/to/data
  batch_size: 32
  num_workers: 18
  font_size: 12
  patch_size: 16
  span_mask_ratio: 0.25
  span_mask_max_length: 6
  span_mask_cum_weights:
  - 0.2
  - 0.4
  - 0.6
  - 0.8
  - 0.9
  - 1.0
  max_num_patches: 512
  train_patterns: null
  renderer_name: adaptive
  shuffle_buffer_size: 1000000
  seed: 42
  languages: arb_Arab,ben_Beng,cmn_Hani,dan_Latn,ell_Grek,eng_Latn,fas_Arab,fin_Latn,heb_Hebr,hin_Deva,kor_Hang,spa_Latn,tha_Thai,tur_Latn,ukr_Cyrl,vie_Latn
model_checkpoint:
  dirpath: null
  filename: null
  monitor: null
  verbose: false
  save_last: true
  save_top_k: -1
  save_on_exception: false
  save_weights_only: false
  mode: min
  auto_insert_metric_name: true
  every_n_train_steps: 10000
  train_time_interval: null
  every_n_epochs: null
  save_on_train_epoch_end: null
  enable_version_counter: true
lr_monitor:
  logging_interval: step
  log_momentum: false
  log_weight_decay: false
optimizer: null
lr_scheduler: null
ckpt_path: null
